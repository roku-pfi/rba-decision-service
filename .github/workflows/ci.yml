# Test on every push and pull request; on main, also build and push the image
# (rba-infra/.github/workflows/service.yml, I-5).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: roku-pfi/rba-infra/.github/workflows/service.yml@main
    with:
      siblings: "rba-features rba-contracts"
      image: true
    permissions:
      contents: read
      id-token: write
